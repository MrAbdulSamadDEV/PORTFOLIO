<!DOCTYPE html>
<html lang="%%HTML_LANG%%">
<head>
  <link rel="icon" href="/assets/logos/logo.png" type="image/png">
  <script src="/js/theme-init.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>%%PAGE_TITLE%%</title>
  <meta name="description" content="%%PAGE_DESCRIPTION%%">
  <meta name="keywords" content="%%PAGE_KEYWORDS%%">
  <meta name="author" content="%%PAGE_AUTHOR%%">
  <meta name="robots" content="%%PAGE_ROBOTS%%">
  <meta name="theme-color" content="%%THEME_COLOR%%">
  <link rel="canonical" href="%%PAGE_CANONICAL%%">

  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="msapplication-TileColor" content="%%THEME_COLOR%%">

  <meta property="og:type" content="%%OG_TYPE%%">
  <meta property="og:site_name" content="%%OG_SITE_NAME%%">
  <meta property="og:title" content="%%OG_TITLE%%">
  <meta property="og:description" content="%%OG_DESCRIPTION%%">
  <meta property="og:url" content="%%PAGE_CANONICAL%%">
  <meta property="og:image" content="%%OG_IMAGE%%">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="%%OG_IMAGE_ALT%%">
  <meta property="og:locale" content="%%OG_LOCALE%%">
  <meta property="og:author" content="%%PAGE_AUTHOR%%">
  <meta property="article:author" content="%%PAGE_AUTHOR%%">
  <meta name="pinterest-rich-pin" content="false">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="%%TWITTER_HANDLE%%">
  <meta name="twitter:creator" content="%%TWITTER_HANDLE%%">
  <meta name="twitter:title" content="%%OG_TITLE%%">
  <meta name="twitter:description" content="%%OG_DESCRIPTION%%">
  <meta name="twitter:image" content="%%OG_IMAGE%%">
  <meta name="twitter:image:alt" content="%%OG_IMAGE_ALT%%">

  <link rel="preload" href="/fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/space-grotesk-latin-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/hero/hero.webp" as="image" media="(min-width: 768px)">

  <style id="critical-css">%%CRITICAL_CSS%%</style>

  <script type="application/ld+json">%%PAGE_JSONLD%%</script>
</head>
<body class="%%BODY_CLASS%%">
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="page-loader" data-loader aria-hidden="true">
    <div class="page-loader__emblem">
      <span class="page-loader__ring page-loader__ring--outer" aria-hidden="true"></span>
      <span class="page-loader__ring page-loader__ring--arc" aria-hidden="true"></span>
      <span class="page-loader__particle page-loader__particle--1" aria-hidden="true"></span>
      <span class="page-loader__particle page-loader__particle--2" aria-hidden="true"></span>
      <span class="page-loader__particle page-loader__particle--3" aria-hidden="true"></span>
      <span class="page-loader__particle page-loader__particle--4" aria-hidden="true"></span>
      <img class="page-loader__logo" src="/assets/logos/logo.png" alt="" width="52" height="52" fetchpriority="high">
    </div>
    <div class="page-loader__progress" aria-hidden="true"><span class="page-loader__bar"></span></div>
    <p class="page-loader__text">Preparing Experience...</p>
  </div>

  <div class="site-background" aria-hidden="true">
    <div class="site-background__glow site-background__glow--one"></div>
    <div class="site-background__glow site-background__glow--two"></div>
    <div class="site-background__glow site-background__glow--three"></div>
    <canvas id="particle-canvas" width="0" height="0"></canvas>
  </div>

  %%NAV%%

  %%MOBILE_DRAWER%%

  <div class="site-shell">
    <main id="main-content" class="site-main">
      %%MAIN_CONTENT%%
    </main>

    %%FOOTER%%
  </div>

  %%SOCIAL_RAIL%%

  %%BACK_TO_TOP%%

  %%AI_WIDGET%%

  <div id="custom-cursor" class="custom-cursor" aria-hidden="true"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
